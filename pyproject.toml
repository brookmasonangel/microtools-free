[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microtools-free"
version = "0.2.0"
description = "Seven free local utilities for technical workflow files"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
microtools-free = "microtools_free.cli:main"

[tool.setuptools]
packages = ["microtools_free"]

[tool.setuptools.package-data]
microtools_free = ["schemas/*/*.json"]
