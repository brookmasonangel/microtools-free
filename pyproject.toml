[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microtools-free"
version = "0.1.0"
description = "Four free local utilities for debugging prompt, config, JSONL and log files"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
microtools-free = "microtools_free.cli:main"

[tool.setuptools]
packages = ["microtools_free"]
