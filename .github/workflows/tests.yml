name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run functional checks
        run: python -m unittest discover -s tests -v
      - name: Run fixture demo
        run: python -m microtools_free.demo
      - name: Install development-only schema validator
        run: python -m pip install "jsonschema>=4.23,<5"
      - name: Compare envelope checks with JSON Schema
        run: python scripts/check_schemas.py
      - name: Install package
        run: python -m pip install .
      - name: Check installed package outside checkout
        run: python scripts/installed_smoke.py
